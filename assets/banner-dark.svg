<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" fill="none" role="img" aria-label="SDLSY — AI Systems &amp; Agent Engineering">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="880" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="78%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="18%" cy="88%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="accent-line" x1="44" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="878" height="214" rx="14" fill="url(#bg-dark)" stroke="#30363d" stroke-width="1.2"/>
  <rect x="1" y="1" width="878" height="214" rx="14" fill="url(#dots-dark)"/>
  <rect x="1" y="1" width="878" height="214" rx="14" fill="url(#glow-blue)"/>
  <rect x="1" y="1" width="878" height="214" rx="14" fill="url(#glow-violet)"/>

  <!-- Top bar -->
  <circle cx="48" cy="34" r="4.5" fill="#475569" fill-opacity="0.7"/>
  <circle cx="64" cy="34" r="4.5" fill="#475569" fill-opacity="0.5"/>
  <circle cx="80" cy="34" r="4.5" fill="#475569" fill-opacity="0.35"/>
  <text x="100" y="38" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.4">~/SDLSY — ai-systems &amp; agent-engineering</text>
  <line x1="44" y1="54" x2="836" y2="54" stroke="#21262d" stroke-width="1"/>

  <!-- Subtle agent-graph geometry on the right -->
  <g opacity="0.75">
    <line x1="686" y1="90" x2="754" y2="74" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="686" y1="90" x2="754" y2="114" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="754" y1="74" x2="816" y2="94" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="754" y1="114" x2="816" y2="94" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="664" y="79" width="44" height="22" rx="6" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1"/>
    <text x="686" y="94" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">HOST</text>
    <rect x="732" y="63" width="44" height="22" rx="6" fill="#161b22" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1"/>
    <text x="754" y="78" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">RAG</text>
    <rect x="732" y="103" width="44" height="22" rx="6" fill="#161b22" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1"/>
    <text x="754" y="118" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">ACP</text>
    <rect x="794" y="83" width="44" height="22" rx="6" fill="#161b22" stroke="#34d399" stroke-opacity="0.6" stroke-width="1"/>
    <text x="816" y="98" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">BOTS</text>
  </g>

  <!-- Main identity -->
  <text x="44" y="102" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6">SDLSY</text>
  <rect x="44" y="112" width="160" height="2" rx="1" fill="url(#accent-line)"/>
  <text x="44" y="138" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">AI Systems &amp; Agent Engineering  ·  Full-Stack &amp; Desktop Tooling  ·  Edge-Cloud</text>

  <!-- Status pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    <rect x="44" y="158" width="304" height="30" rx="15" fill="#161b22" stroke="#2ea043" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="62" cy="173" r="4" fill="#3fb950"/>
    <text x="74" y="177" fill="#e6edf3">5 Merged PRs · Orca / CrewAI / LightRAG</text>

    <rect x="360" y="158" width="236" height="30" rx="15" fill="#161b22" stroke="#388bfd" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="378" cy="173" r="4" fill="#58a6ff"/>
    <text x="390" y="177" fill="#e6edf3">Coding Agents &amp; Multimodal RAG</text>

    <rect x="608" y="158" width="198" height="30" rx="15" fill="#161b22" stroke="#8957e5" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="626" cy="173" r="4" fill="#a371f7"/>
    <text x="638" y="177" fill="#e6edf3">TypeScript · Python · Kotlin</text>
  </g>
