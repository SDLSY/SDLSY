<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" fill="none" role="img" aria-label="SDLSY — AI Systems &amp; Agent Engineering">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="880" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="glow-blue-l" cx="78%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet-l" cx="18%" cy="88%" r="45%">
      <stop offset="0%" stop-color="#8250df" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="accent-line-l" x1="44" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="50%" stop-color="#8250df"/>
      <stop offset="100%" stop-color="#1a7f37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="878" height="214" rx="14" fill="url(#bg-light)" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="1" y="1" width="878" height="214" rx="14" fill="url(#dots-light)"/>
  <rect x="1" y="1" width="878" height="214" rx="14" fill="url(#glow-blue-l)"/>
  <rect x="1" y="1" width="878" height="214" rx="14" fill="url(#glow-violet-l)"/>

  <!-- Top bar -->
  <circle cx="48" cy="34" r="4.5" fill="#94a3b8" fill-opacity="0.7"/>
