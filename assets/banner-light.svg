  <circle cx="80" cy="34" r="4.5" fill="#94a3b8" fill-opacity="0.35"/>
  <text x="100" y="38" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.4">~/SDLSY — ai-systems &amp; agent-engineering</text>
  <line x1="44" y1="54" x2="836" y2="54" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Subtle agent-graph geometry on the right -->
  <g opacity="0.9">
    <line x1="686" y1="90" x2="754" y2="74" stroke="#0969da" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="686" y1="90" x2="754" y2="114" stroke="#8250df" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="754" y1="74" x2="816" y2="94" stroke="#1a7f37" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="754" y1="114" x2="816" y2="94" stroke="#1a7f37" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="664" y="79" width="44" height="22" rx="6" fill="#ffffff" stroke="#0969da" stroke-opacity="0.5" stroke-width="1"/>
    <text x="686" y="94" text-anchor="middle" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">HOST</text>
    <rect x="732" y="63" width="44" height="22" rx="6" fill="#ffffff" stroke="#8250df" stroke-opacity="0.5" stroke-width="1"/>
    <text x="754" y="78" text-anchor="middle" fill="#8250df" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">RAG</text>
    <rect x="732" y="103" width="44" height="22" rx="6" fill="#ffffff" stroke="#8250df" stroke-opacity="0.5" stroke-width="1"/>
    <text x="754" y="118" text-anchor="middle" fill="#8250df" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">ACP</text>
    <rect x="794" y="83" width="44" height="22" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-opacity="0.55" stroke-width="1"/>
    <text x="816" y="98" text-anchor="middle" fill="#1a7f37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">BOTS</text>
  </g>

  <!-- Main identity -->
  <text x="44" y="102" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6">SDLSY</text>
  <rect x="44" y="112" width="160" height="2" rx="1" fill="url(#accent-line-l)"/>
  <text x="44" y="138" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">AI Systems &amp; Agent Engineering  ·  Full-Stack &amp; Desktop Tooling  ·  Edge-Cloud</text>

  <!-- Status pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    <rect x="44" y="158" width="206" height="30" rx="15" fill="#ffffff" stroke="#1a7f37" stroke-opacity="0.38" stroke-width="1"/>
    <circle cx="62" cy="173" r="4" fill="#1a7f37"/>
    <text x="74" y="177" fill="#1f2328">stablyai/orca · 2 Merged PRs</text>

    <rect x="262" y="158" width="236" height="30" rx="15" fill="#ffffff" stroke="#0969da" stroke-opacity="0.38" stroke-width="1"/>
    <circle cx="280" cy="173" r="4" fill="#0969da"/>
    <text x="292" y="177" fill="#1f2328">Coding Agents &amp; Multimodal RAG</text>

    <rect x="510" y="158" width="198" height="30" rx="15" fill="#ffffff" stroke="#8250df" stroke-opacity="0.38" stroke-width="1"/>
    <circle cx="528" cy="173" r="4" fill="#8250df"/>
